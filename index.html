<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>남부장님 감정 관찰일지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ede3ce;
    --bg-warm: #ddd0b3;
    --surface: #f6efdb;
    --surface-2: #fcf6e4;
    --ink: #221c12;
    --ink-soft: #4a3f2c;
    --muted: #998a6f;
    --accent: #8b5a2b;
    --accent-2: #b8492a;
    --stamp: #c0392b;
    --line: rgba(34, 28, 18, 0.15);
    --serif: 'Gowun Batang', 'Noto Serif KR', serif;
    --sans: 'Gowun Dodum', 'Noto Sans KR', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    min-height: 100vh;
    background-image:
      radial-gradient(at 15% 5%, rgba(139, 90, 43, 0.08) 0%, transparent 55%),
      radial-gradient(at 85% 95%, rgba(184, 73, 42, 0.06) 0%, transparent 50%);
  }
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' /%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.45'/%3E%3C/svg%3E");
    opacity: 0.5;
    pointer-events: none;
    z-index: 0;
    mix-blend-mode: multiply;
  }
  .wrap {
    position: relative; z-index: 1;
    max-width: 900px;
    margin: 0 auto;
    padding: 48px 24px 80px;
  }

  /* ─── Setup screen ─── */
  .setup {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 40px 36px;
    text-align: center;
    margin-top: 60px;
    position: relative;
  }
  .setup::before {
    content: '';
    position: absolute;
    inset: 12px;
    border: 1px solid var(--line);
    pointer-events: none;
  }
  .setup h2 {
    font-family: var(--serif);
    font-size: 26px;
    margin-bottom: 12px;
  }
  .setup p {
    font-family: var(--serif);
    font-style: italic;
    color: var(--ink-soft);
    margin-bottom: 24px;
    line-height: 1.7;
    font-size: 14px;
  }
  .setup p code {
    font-family: monospace;
    background: var(--bg-warm);
    padding: 2px 6px;
    border-radius: 2px;
    font-style: normal;
    font-size: 12px;
  }
  .setup input.url-input {
    width: 100%;
    padding: 12px 14px;
    font-family: monospace;
    font-size: 13px;
    border: 1px solid var(--ink);
    background: var(--surface-2);
    border-radius: 2px;
    margin-bottom: 16px;
    outline: none;
  }
  .setup input.url-input:focus { border-color: var(--accent); }

  /* ─── Header ─── */
  header.masthead {
    text-align: center;
    margin-bottom: 40px;
    padding-bottom: 24px;
    border-bottom: 2px solid var(--ink);
    position: relative;
  }
  header.masthead::after {
    content: '';
    display: block;
    width: 60%;
    margin: 4px auto 0;
    border-bottom: 1px solid var(--ink);
  }
  .mast-meta {
    display: flex;
    justify-content: space-between;
    font-family: var(--sans);
    font-size: 10px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 18px;
  }
  .mast-prefix {
    font-family: var(--serif);
    font-style: italic;
    font-size: 13px;
    color: var(--accent);
    letter-spacing: 0.08em;
    margin-bottom: 6px;
  }
  .mast-title {
    font-family: var(--serif);
    font-weight: 700;
    font-size: clamp(34px, 5.5vw, 52px);
    letter-spacing: -0.02em;
    line-height: 1.1;
    margin-bottom: 10px;
  }
  .mast-title em {
    font-style: italic;
    color: var(--accent-2);
    font-weight: 400;
  }
  .mast-sub {
    font-family: var(--serif);
    font-style: italic;
    color: var(--ink-soft);
    font-size: 14px;
    margin-bottom: 4px;
  }
  .stamp {
    position: absolute;
    top: 8px;
    right: 0;
    width: 72px;
    height: 72px;
    border: 2.5px solid var(--stamp);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    transform: rotate(-12deg);
    opacity: 0.85;
    pointer-events: none;
  }
  .stamp-text {
    font-family: var(--serif);
    font-weight: 700;
    color: var(--stamp);
    font-size: 11px;
    text-align: center;
    line-height: 1.2;
    letter-spacing: 0.05em;
  }
  .header-tools {
    position: absolute;
    top: 8px;
    left: 0;
    display: flex;
    gap: 6px;
  }
  .icon-btn {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--ink-soft);
    width: 30px; height: 30px;
    border-radius: 2px;
    cursor: pointer;
    font-size: 13px;
    transition: all 0.2s;
  }
  .icon-btn:hover {
    background: var(--ink); color: var(--surface);
    border-color: var(--ink);
  }

  /* ─── Sections ─── */
  section { margin-bottom: 44px; }
  .sec-head {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 20px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--line);
  }
  .sec-num {
    font-family: var(--serif);
    font-style: italic;
    color: var(--accent);
    font-size: 13px;
    letter-spacing: 0.05em;
  }
  .sec-title {
    font-family: var(--serif);
    font-weight: 700;
    font-size: 20px;
  }
  .sec-meta {
    margin-left: auto;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.08em;
  }

  /* ─── Insights ─── */
  .insights {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
    margin-bottom: 16px;
  }
  .insight-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 16px 18px;
  }
  .insight-label {
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-soft);
    font-weight: 700;
    margin-bottom: 10px;
  }
  .insight-value {
    font-family: var(--serif);
    font-weight: 700;
    font-size: 32px;
    line-height: 1;
    color: var(--accent);
  }
  .insight-value.emoji-val {
    font-family: var(--sans);
    font-size: 34px;
  }
  .insight-sub {
    font-family: var(--serif);
    font-style: italic;
    color: var(--muted);
    font-size: 12px;
    margin-top: 6px;
  }

  /* ─── Compose ─── */
  .compose {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 26px 30px 22px;
    box-shadow: 0 1px 0 rgba(34, 28, 18, 0.04), 0 30px 60px -30px rgba(34, 28, 18, 0.18);
    position: relative;
  }
  .compose::before {
    content: '';
    position: absolute;
    inset: 12px;
    border: 1px solid var(--line);
    border-radius: 2px;
    pointer-events: none;
  }
  .field { margin-bottom: 20px; }
  .field label {
    display: block;
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 10px;
    font-weight: 700;
  }
  .name-input, .note-input {
    width: 100%;
    border: none;
    border-bottom: 1px solid var(--ink);
    background: transparent;
    padding: 8px 2px;
    font-family: var(--serif);
    font-size: 16px;
    color: var(--ink);
    outline: none;
    transition: border-color 0.2s;
  }
  .name-input:focus, .note-input:focus { border-bottom-color: var(--accent); }
  .note-input {
    font-family: var(--sans);
    font-size: 14px;
    resize: vertical;
    min-height: 60px;
    line-height: 1.7;
  }
  .name-input::placeholder, .note-input::placeholder {
    color: var(--muted); font-style: italic;
  }

  .moods {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(78px, 1fr));
    gap: 7px;
  }
  .mood {
    background: var(--surface-2);
    border: 1px solid transparent;
    border-radius: 6px;
    padding: 12px 6px 9px;
    cursor: pointer;
    text-align: center;
    transition: all 0.18s ease;
  }
  .mood:hover { background: var(--bg-warm); transform: translateY(-2px); }
  .mood.active {
    background: var(--ink); color: var(--surface);
    border-color: var(--ink);
    transform: translateY(-2px);
    box-shadow: 0 6px 14px -6px rgba(34, 28, 18, 0.4);
  }
  .mood-emoji { font-size: 26px; display: block; line-height: 1; margin-bottom: 5px; }
  .mood-label { font-size: 10.5px; letter-spacing: 0.02em; }

  .submit-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-top: 4px;
    padding-top: 14px;
    border-top: 1px dashed var(--line);
  }
  .hint {
    font-family: var(--serif);
    font-style: italic;
    color: var(--muted);
    font-size: 13px;
  }
  button.save {
    font-family: var(--sans);
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-weight: 700;
    padding: 11px 22px;
    background: var(--ink);
    color: var(--surface);
    border: none;
    border-radius: 2px;
    cursor: pointer;
    transition: all 0.2s;
  }
  button.save:hover:not(:disabled) {
    background: var(--accent-2);
    letter-spacing: 0.2em;
  }
  button.save:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ─── Today list ─── */
  .today {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 12px;
  }
  .entry-card {
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 18px 18px 16px;
    position: relative;
    transition: transform 0.2s;
  }
  .entry-card:hover { transform: translateY(-3px) rotate(-0.4deg); }
  .entry-card .big-emoji { font-size: 40px; line-height: 1; display: block; margin-bottom: 8px; }
  .entry-card .label {
    font-size: 11px;
    color: var(--accent-2);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .entry-card .note {
    font-size: 13px;
    color: var(--ink-soft);
    line-height: 1.55;
    font-family: var(--serif);
    margin-bottom: 10px;
  }
  .entry-card .observer {
    font-family: var(--serif);
    font-style: italic;
    font-size: 11px;
    color: var(--muted);
    padding-top: 8px;
    border-top: 1px dashed var(--line);
  }
  .entry-card .observer::before {
    content: '— ';
  }
  .entry-card .time {
    position: absolute;
    top: 12px; right: 12px;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.05em;
  }
  .entry-card .del {
    position: absolute;
    bottom: 8px; right: 10px;
    background: none; border: none;
    color: var(--muted);
    font-size: 11px;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.2s, color 0.2s;
  }
  .entry-card:hover .del { opacity: 1; }
  .entry-card .del:hover { color: var(--accent-2); }

  /* ─── Timeline ─── */
  .day-group { margin-bottom: 26px; }
  .day-head {
    font-family: var(--serif);
    font-style: italic;
    font-size: 15px;
    color: var(--ink-soft);
    margin-bottom: 10px;
    display: flex; align-items: center; gap: 12px;
  }
  .day-head .day-count {
    font-size: 11px;
    color: var(--muted);
    font-style: normal;
    letter-spacing: 0.05em;
  }
  .day-head::after { content: ''; flex: 1; height: 1px; background: var(--line); }
  .day-entries { display: flex; flex-direction: column; gap: 8px; }
  .row-entry {
    display: grid;
    grid-template-columns: 50px 1fr auto auto;
    align-items: center;
    gap: 14px;
    padding: 12px 16px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 3px;
    transition: background 0.2s;
  }
  .row-entry:hover { background: var(--surface-2); }
  .row-emoji { font-size: 28px; line-height: 1; text-align: center; }
  .row-label {
    color: var(--accent-2);
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 700;
    margin-bottom: 3px;
  }
  .row-note {
    font-family: var(--serif);
    font-size: 13px;
    color: var(--ink-soft);
    line-height: 1.5;
    margin-bottom: 4px;
  }
  .row-note.no-note {
    font-style: italic;
    color: var(--muted);
  }
  .row-observer {
    font-family: var(--serif);
    font-style: italic;
    font-size: 11px;
    color: var(--muted);
  }
  .row-time {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.05em;
    white-space: nowrap;
  }
  .row-del {
    background: none; border: none;
    color: var(--muted);
    font-size: 11px;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.2s, color 0.2s;
  }
  .row-entry:hover .row-del { opacity: 1; }
  .row-del:hover { color: var(--accent-2); }

  /* ─── Empty ─── */
  .empty {
    text-align: center;
    padding: 36px 20px;
    color: var(--muted);
    font-family: var(--serif);
    font-style: italic;
    grid-column: 1 / -1;
  }
  .empty .e-emoji {
    font-size: 36px;
    display: block;
    margin-bottom: 10px;
    opacity: 0.6;
  }

  .spinner {
    display: inline-block;
    width: 12px; height: 12px;
    border: 2px solid var(--muted);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .toast {
    position: fixed;
    bottom: 30px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--ink); color: var(--surface);
    padding: 12px 24px;
    border-radius: 2px;
    font-family: var(--sans);
    font-size: 13px;
    letter-spacing: 0.08em;
    opacity: 0;
    transition: all 0.3s ease;
    z-index: 100;
    max-width: 80vw;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.error { background: var(--accent-2); }

  .hide { display: none !important; }

  @media (max-width: 600px) {
    .wrap { padding: 32px 16px 60px; }
    .stamp { width: 56px; height: 56px; top: 4px; }
    .stamp-text { font-size: 9px; }
    .header-tools { position: static; justify-content: center; margin-bottom: 12px; }
    .compose { padding: 22px 18px; }
    .row-entry { grid-template-columns: 40px 1fr auto; }
    .row-del { display: none; }
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- ── SETUP (only on first visit / config) ── -->
  <div class="setup hide" id="setupScreen">
    <h2>관찰 본부에 접속</h2>
    <p>
      관찰일지를 사용하려면<br>
      Google Apps Script 배포 URL이 필요합니다.<br>
      <br>
      형식: <code>https://script.google.com/macros/s/.../exec</code>
    </p>
    <input type="text" class="url-input" id="setupUrl" placeholder="https://script.google.com/macros/s/.../exec">
    <button class="save" id="setupSaveBtn">연결하기</button>
  </div>

  <!-- ── MAIN APP ── -->
  <div id="mainApp" class="hide">
    <header class="masthead">
      <div class="header-tools">
        <button class="icon-btn" id="refreshBtn" title="새로고침">↻</button>
        <button class="icon-btn" id="settingsBtn" title="설정">⚙</button>
      </div>
      <div class="stamp"><span class="stamp-text">機密<br>CONFID.</span></div>

      <div class="mast-meta">
        <span id="dateLabel">—</span>
        <span>FILE NO. 001</span>
      </div>
      <div class="mast-prefix">— 비밀 관찰 기록 —</div>
      <h1 class="mast-title">남부장님 <em>감정</em> 관찰일지</h1>
      <p class="mast-sub">"오늘 부장님은 어떤 표정이셨나요?"</p>
    </header>

    <!-- ── Insights ── -->
    <section>
      <div class="sec-head">
        <span class="sec-num">·</span>
        <h2 class="sec-title">관찰 통계</h2>
        <span class="sec-meta">최근 30일</span>
      </div>
      <div class="insights" id="insightsGrid"></div>
    </section>

    <!-- ── Compose ── -->
    <section>
      <div class="sec-head">
        <span class="sec-num">No. 01</span>
        <h2 class="sec-title">새 관찰 기록</h2>
        <span class="sec-meta">목격담 등록</span>
      </div>

      <div class="compose">
        <div class="field">
          <label>관찰자 이름</label>
          <input type="text" class="name-input" id="nameInput" placeholder="누가 목격하셨나요?" maxlength="20">
        </div>

        <div class="field">
          <label>관찰된 감정</label>
          <div class="moods" id="moodGrid"></div>
        </div>

        <div class="field">
          <label>상황 메모 (선택)</label>
          <textarea class="note-input" id="noteInput" placeholder="어떤 상황이었나요? 표정·말투·행동 등..." maxlength="300"></textarea>
        </div>

        <div class="submit-row">
          <span class="hint" id="hint">감정 하나를 골라주세요</span>
          <button class="save" id="saveBtn" disabled>기록 제출</button>
        </div>
      </div>
    </section>

    <!-- ── Today ── -->
    <section>
      <div class="sec-head">
        <span class="sec-num">No. 02</span>
        <h2 class="sec-title">오늘의 목격담</h2>
        <span class="sec-meta" id="todayCount">불러오는 중…</span>
      </div>
      <div class="today" id="todayBoard">
        <div class="empty"><span class="spinner"></span></div>
      </div>
    </section>

    <!-- ── Past ── -->
    <section>
      <div class="sec-head">
        <span class="sec-num">No. 03</span>
        <h2 class="sec-title">지난 기록 보관소</h2>
        <span class="sec-meta">시간순</span>
      </div>
      <div id="timeline"></div>
    </section>
  </div>

</div>

<div class="toast" id="toast">기록되었습니다</div>

<script>
const URL_KEY = 'nam-bujang-script-url';
const NAME_KEY = 'nam-bujang-observer-name';
let SCRIPT_URL = localStorage.getItem(URL_KEY) || '';

const MOODS = [
  { e: '😊', l: '기분좋음' }, { e: '😄', l: '즐거움' }, { e: '🥰', l: '온화함' },
  { e: '😌', l: '여유로움' }, { e: '💪', l: '의욕충만' }, { e: '😎', l: '쿨함' },
  { e: '🥳', l: '들뜸' }, { e: '🤩', l: '신남' }, { e: '🤔', l: '깊은생각' },
  { e: '😐', l: '무표정' }, { e: '😴', l: '피곤함' }, { e: '☕', l: '커피찾음' },
  { e: '😰', l: '초조함' }, { e: '😤', l: '답답함' }, { e: '🤯', l: '폭발직전' },
  { e: '😔', l: '침울함' }, { e: '😢', l: '슬픔' }, { e: '😡', l: '분노' },
  { e: '🙄', l: '한숨' }, { e: '😏', l: '의미심장' }, { e: '🥱', l: '권태로움' },
];

const POSITIVE = new Set(['😊','😄','🥰','😌','💪','😎','🥳','🤩','☕','😏']);
const NEGATIVE = new Set(['😰','😤','🤯','😔','😢','😡','🙄']);

let selectedMood = null;
let entries = [];
const $ = (id) => document.getElementById(id);

function toast(msg, isError = false) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.toggle('error', isError);
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2400);
}

// ── Setup flow ──
function showSetup() {
  $('setupScreen').classList.remove('hide');
  $('mainApp').classList.add('hide');
  $('setupUrl').value = SCRIPT_URL || '';
}
function showMain() {
  $('setupScreen').classList.add('hide');
  $('mainApp').classList.remove('hide');
}
$('setupSaveBtn').addEventListener('click', async () => {
  const url = $('setupUrl').value.trim();
  if (!url.startsWith('https://script.google.com/')) {
    toast('올바른 Apps Script URL이 아닙니다', true);
    return;
  }
  SCRIPT_URL = url;
  localStorage.setItem(URL_KEY, url);
  showMain();
  await loadAll();
});

// ── Date ──
function setDate() {
  const now = new Date();
  const days = ['일','월','화','수','목','금','토'];
  $('dateLabel').textContent =
    `${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')} (${days[now.getDay()]})`;
}
setDate();

// ── Moods ──
function renderMoods() {
  const grid = $('moodGrid');
  grid.innerHTML = '';
  MOODS.forEach((m) => {
    const div = document.createElement('div');
    div.className = 'mood';
    div.innerHTML = `<span class="mood-emoji">${m.e}</span><span class="mood-label">${m.l}</span>`;
    div.addEventListener('click', () => {
      selectedMood = m;
      document.querySelectorAll('.mood').forEach(el => el.classList.remove('active'));
      div.classList.add('active');
      updateSaveBtn();
    });
    grid.appendChild(div);
  });
}
renderMoods();

function updateSaveBtn() {
  const name = $('nameInput').value.trim();
  const ok = selectedMood && name.length > 0;
  $('saveBtn').disabled = !ok;
  if (!selectedMood) $('hint').textContent = '감정 하나를 골라주세요';
  else if (!name) $('hint').textContent = '관찰자 이름을 적어주세요';
  else $('hint').textContent = `오늘 부장님: ${selectedMood.l}`;
}
$('nameInput').addEventListener('input', () => {
  localStorage.setItem(NAME_KEY, $('nameInput').value.trim());
  updateSaveBtn();
});
$('nameInput').value = localStorage.getItem(NAME_KEY) || '';

// ── API ──
async function apiGet() {
  const res = await fetch(SCRIPT_URL, { method: 'GET', redirect: 'follow' });
  const data = await res.json();
  if (!data.ok) throw new Error(data.error || 'unknown');
  return data.entries;
}
async function apiPost(payload) {
  const res = await fetch(SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload),
    redirect: 'follow',
  });
  const data = await res.json();
  if (!data.ok) throw new Error(data.error || 'unknown');
  return data;
}

// ── Load ──
async function loadAll() {
  if (!SCRIPT_URL) return showSetup();
  $('todayCount').innerHTML = '<span class="spinner"></span>';
  $('todayBoard').innerHTML = `<div class="empty"><span class="spinner"></span></div>`;
  try {
    entries = await apiGet();
    render();
  } catch (e) {
    console.error(e);
    toast('서버 연결 실패: ' + e.message, true);
    $('todayCount').textContent = '연결 실패';
    $('todayBoard').innerHTML = `<div class="empty">
      <span class="e-emoji">⚠️</span>
      서버에 연결할 수 없습니다.<br>설정(⚙)에서 URL을 확인해주세요.
    </div>`;
  }
}

// ── Add ──
async function addEntry() {
  const name = $('nameInput').value.trim();
  const note = $('noteInput').value.trim();
  if (!name || !selectedMood) return;

  $('saveBtn').disabled = true;
  $('saveBtn').textContent = '제출 중...';

  const entry = {
    id: `${Date.now()}_${Math.random().toString(36).slice(2,7)}`,
    name, note,
    emoji: selectedMood.e,
    moodLabel: selectedMood.l,
    timestamp: Date.now(),
  };

  try {
    await apiPost({ action: 'add', ...entry });
    entries.unshift(entry);
    render();
    toast('관찰 기록이 제출되었습니다 ✓');
    $('noteInput').value = '';
    selectedMood = null;
    document.querySelectorAll('.mood').forEach(el => el.classList.remove('active'));
  } catch (e) {
    toast('제출 실패: ' + e.message, true);
  } finally {
    $('saveBtn').textContent = '기록 제출';
    updateSaveBtn();
  }
}
$('saveBtn').addEventListener('click', addEntry);

async function deleteEntry(id) {
  try {
    await apiPost({ action: 'delete', id });
    entries = entries.filter(e => e.id !== id);
    render();
    toast('삭제되었습니다');
  } catch (e) {
    toast('삭제 실패: ' + e.message, true);
  }
}

// ── Helpers ──
function timeStr(ts) {
  const d = new Date(ts);
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function dayKey(ts) {
  const d = new Date(ts);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function isToday(ts) { return dayKey(ts) === dayKey(Date.now()); }
function dayLabel(ts) {
  const d = new Date(ts);
  const today = new Date(); today.setHours(0,0,0,0);
  const that = new Date(d); that.setHours(0,0,0,0);
  const diff = Math.round((today - that) / 86400000);
  if (diff === 0) return '오늘';
  if (diff === 1) return '어제';
  const days = ['일','월','화','수','목','금','토'];
  if (diff < 7) return `${diff}일 전 (${days[d.getDay()]})`;
  return `${d.getMonth()+1}월 ${d.getDate()}일 (${days[d.getDay()]})`;
}
function escapeHtml(s) {
  return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ── Insights ──
function renderInsights() {
  const grid = $('insightsGrid');
  const now = Date.now();
  const last30 = entries.filter(e => now - e.timestamp < 30 * 86400000);

  let topEmoji = '—', topLabel = '아직 관찰 기록 없음';
  if (last30.length > 0) {
    const counts = {};
    last30.forEach(e => {
      const k = `${e.emoji}|${e.moodLabel}`;
      counts[k] = (counts[k] || 0) + 1;
    });
    const top = Object.entries(counts).sort((a,b) => b[1]-a[1])[0];
    const [emoji, label] = top[0].split('|');
    topEmoji = emoji;
    topLabel = `${label} · ${top[1]}회`;
  }

  let posPercent = '—', posSub = '아직 기록 없음';
  if (last30.length > 0) {
    const pos = last30.filter(e => POSITIVE.has(e.emoji)).length;
    const pct = Math.round(pos / last30.length * 100);
    posPercent = `${pct}%`;
    posSub = `30일 중 평온 ${pos}회`;
  }

  const observers = new Set(entries.map(e => e.name)).size;
  const total = entries.length;

  grid.innerHTML = `
    <div class="insight-card">
      <div class="insight-label">대표 표정</div>
      <div class="insight-value emoji-val">${topEmoji}</div>
      <div class="insight-sub">${topLabel}</div>
    </div>
    <div class="insight-card">
      <div class="insight-label">평온 지수</div>
      <div class="insight-value">${posPercent}</div>
      <div class="insight-sub">${posSub}</div>
    </div>
    <div class="insight-card">
      <div class="insight-label">관찰자</div>
      <div class="insight-value">${observers}<span style="font-size:18px;margin-left:4px">명</span></div>
      <div class="insight-sub">함께 지켜보고 있어요</div>
    </div>
    <div class="insight-card">
      <div class="insight-label">총 목격담</div>
      <div class="insight-value">${total}</div>
      <div class="insight-sub">기록은 곧 통찰</div>
    </div>
  `;
}

// ── Render ──
function render() {
  entries.sort((a,b) => b.timestamp - a.timestamp);
  const todayEntries = entries.filter(e => isToday(e.timestamp));
  const past = entries.filter(e => !isToday(e.timestamp));

  $('todayCount').textContent = `${todayEntries.length}건의 목격담`;

  // Today
  const tb = $('todayBoard');
  if (todayEntries.length === 0) {
    tb.innerHTML = `<div class="empty">
      <span class="e-emoji">🕵️</span>
      오늘은 아직 목격담이 없습니다.<br>첫 관찰자가 되어주세요.
    </div>`;
  } else {
    tb.innerHTML = todayEntries.map(e => `
      <div class="entry-card">
        <span class="time">${timeStr(e.timestamp)}</span>
        <span class="big-emoji">${e.emoji}</span>
        <div class="label">${escapeHtml(e.moodLabel)}</div>
        ${e.note ? `<div class="note">"${escapeHtml(e.note)}"</div>` : ''}
        <div class="observer">${escapeHtml(e.name)} 목격</div>
        <button class="del" data-id="${e.id}">삭제</button>
      </div>
    `).join('');
  }

  // Timeline
  const tl = $('timeline');
  if (past.length === 0) {
    tl.innerHTML = `<div class="empty">
      <span class="e-emoji">📂</span>
      보관된 기록이 없습니다.
    </div>`;
  } else {
    const groups = {};
    past.forEach(e => {
      const k = dayKey(e.timestamp);
      if (!groups[k]) groups[k] = { label: dayLabel(e.timestamp), items: [] };
      groups[k].items.push(e);
    });
    tl.innerHTML = Object.values(groups).map(g => `
      <div class="day-group">
        <div class="day-head">
          <span>${g.label}</span>
          <span class="day-count">${g.items.length}건</span>
        </div>
        <div class="day-entries">
          ${g.items.map(e => `
            <div class="row-entry">
              <div class="row-emoji">${e.emoji}</div>
              <div>
                <div class="row-label">${escapeHtml(e.moodLabel)}</div>
                <div class="row-note ${!e.note ? 'no-note' : ''}">${e.note ? '"' + escapeHtml(e.note) + '"' : '(메모 없음)'}</div>
                <div class="row-observer">— ${escapeHtml(e.name)} 목격</div>
              </div>
              <div class="row-time">${timeStr(e.timestamp)}</div>
              <button class="row-del" data-id="${e.id}">삭제</button>
            </div>
          `).join('')}
        </div>
      </div>
    `).join('');
  }

  renderInsights();

  document.querySelectorAll('.del, .row-del').forEach(b => {
    b.addEventListener('click', () => {
      if (confirm('이 기록을 삭제할까요?')) deleteEntry(b.dataset.id);
    });
  });
}

// ── Toolbar ──
$('refreshBtn').addEventListener('click', loadAll);
$('settingsBtn').addEventListener('click', showSetup);

// ── Boot ──
if (SCRIPT_URL) {
  showMain();
  loadAll();
} else {
  showSetup();
}
</script>
